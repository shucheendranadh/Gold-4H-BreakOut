name: Deploy to AWS

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS Linux
    runs-on: ubuntu-latest

    steps:
      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ vars.AWS_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          # pandas/numpy/streamlit installs can take 15+ min on first run
          command_timeout: 20m
          script: |
            set -e

            # ── Resolve all GitHub Actions variables into bash variables ──────────
            RUN_USER="${{ vars.AWS_USERNAME }}"
            PROJECT_DIR="${{ vars.PROJECT_LOCATION }}"
            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            BRANCH="${{ github.ref_name }}"
            TOTAL_LOTS="${{ vars.TOTAL_LOTS }}"
            ENABLE_PAPER_TRADING="${{ vars.ENABLE_PAPER_TRADING }}"
            INITIAL_PAPER_CAPITAL="${{ vars.INITIAL_PAPER_CAPITAL }}"

            # ── 0. Fix sudoers syntax error (missing username prefix) ─────────────
            SUDOERS_FILE="/etc/sudoers.d/pdh_permissions"
            if [ -f "$SUDOERS_FILE" ] && sudo grep -q "^ALL=(ALL)" "$SUDOERS_FILE" 2>/dev/null; then
              echo "==> Fixing sudoers syntax error in $SUDOERS_FILE..."
              sudo sed -i "s|^ALL=(ALL)|$RUN_USER ALL=(ALL)|" "$SUDOERS_FILE"
              echo "  Fixed."
            fi

            # ── 1. Clone on first deploy, pull on subsequent deploys ────────────
            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo "==> First deployment: cloning repository..."
              mkdir -p "$PROJECT_DIR"
              git clone "$REPO_URL" "$PROJECT_DIR"
            else
              echo "==> Pulling latest code..."
              cd "$PROJECT_DIR"
              git remote set-url origin "$REPO_URL"
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
            fi

            # ── 2. Run setup script (idempotent — safe on every deploy) ─────────
            echo "==> Running setup script..."
            cd "$PROJECT_DIR"
            chmod +x scripts/setup_aws.sh
            sudo bash scripts/setup_aws.sh \
              --project "$PROJECT_DIR" \
              --user    "$RUN_USER"

            # ── 3. Write runtime config from GitHub variables ────────────────────
            echo "==> Writing runtime config..."
            sudo mkdir -p /etc/gold-bot
            printf 'TOTAL_LOTS=%s\nENABLE_PAPER_TRADING=%s\nINITIAL_PAPER_CAPITAL=%s\n' \
              "$TOTAL_LOTS" "$ENABLE_PAPER_TRADING" "$INITIAL_PAPER_CAPITAL" \
              | sudo tee /etc/gold-bot/runtime.env > /dev/null
            sudo chmod 644 /etc/gold-bot/runtime.env

            # ── 3.5 Check Token ───────────────────────────────────────────────
            echo "==> Checking Upstox Token..."
            TOKEN_FILE="/home/$RUN_USER/tradingbridge/.token.env"
            if [ -f "$TOKEN_FILE" ]; then
                echo "Token file found."
            else
                echo "::warning title=Missing Token::Token file NOT found at $TOKEN_FILE"
            fi

            # ── 4. Diagnostics before update ─────────────────────────────────────
            echo "==> Current service status..."
            sudo systemctl status gold-4h-breakout.service --no-pager || echo "Service not running."

            # ── 5. Restart the bot services ───────────────────────────────────────
            echo "==> Restarting gold-bot services with new code..."
            sudo systemctl daemon-reload
            sudo systemctl restart gold-4h-breakout.service || true
            sudo systemctl restart gold-dashboard.service || true

            echo ""
            echo "==> Verifying service health..."
            sleep 2
            sudo systemctl status gold-4h-breakout.service --no-pager --lines=20 || true
            sudo systemctl status gold-dashboard.service --no-pager --lines=20 || true

            echo ""
            echo "==> Recent Logs (GOLD_MARKET.log):"
            tail -n 20 "$PROJECT_DIR/Logs/GOLD_MARKET.log" || echo "Log file not found."

            echo ""
            echo "==> Deployment complete."
