name: Deploy to AWS

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS Linux
    runs-on: ubuntu-latest

    steps:
      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ vars.AWS_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          # Increase timeout for first-time setup (apt-get + pip can be slow)
          command_timeout: 10m
          script: |
            set -e

            PROJECT_DIR="${{ vars.PROJECT_LOCATION }}"
            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

            # ── 1. Clone on first deploy, pull on subsequent deploys ────────────
            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo "==> First deployment: cloning repository..."
              mkdir -p "$PROJECT_DIR"
              git clone "$REPO_URL" "$PROJECT_DIR"
            else
              echo "==> Pulling latest code..."
              cd "$PROJECT_DIR"
              # Update remote URL in case token changed
              git remote set-url origin "$REPO_URL"
              git fetch origin ${{ github.ref_name }}
              git reset --hard origin/${{ github.ref_name }}
            fi

            # ── 2. Run setup script (idempotent — safe on every deploy) ─────────
            echo "==> Running setup script..."
            cd "$PROJECT_DIR"
            chmod +x scripts/setup_aws.sh
            sudo bash scripts/setup_aws.sh \
              --project "$PROJECT_DIR" \
              --user    "${{ vars.AWS_USERNAME }}"

            # ── 3. Write runtime config from GitHub variables ────────────────────
            echo "==> Writing runtime config..."
            sudo mkdir -p /etc/gold-bot
            printf 'TOTAL_LOTS=${{ vars.TOTAL_LOTS }}\nENABLE_PAPER_TRADING=${{ vars.ENABLE_PAPER_TRADING }}\nINITIAL_PAPER_CAPITAL=${{ vars.INITIAL_PAPER_CAPITAL }}\n' | sudo tee /etc/gold-bot/runtime.env > /dev/null
            sudo chmod 644 /etc/gold-bot/runtime.env

            # ── 3.5 Check Token ───────────────────────────────────────────────
            echo "==> Checking Upstox Token..."
            if [ -f "/home/${{ vars.AWS_USERNAME }}/tradingbridge/.token.env" ]; then
                echo "Token file found."
            else
                echo "::warning title=Missing Token::Token file NOT found at /home/${{ vars.AWS_USERNAME }}/tradingbridge/.token.env"
            fi

            # ── 4. Diagnostics before update ─────────────────────────────────────
            echo "==> Current service status..."
            sudo systemctl status gold-4h-breakout.service --no-pager || echo "Service not running."
            
            # ── 5. Restart the bot service ───────────────────────────────────────
            echo "==> Restarting gold-bot service with new code..."
            sudo systemctl daemon-reload
            sudo systemctl restart gold-4h-breakout.service || true

            echo ""
            echo "==> Verifying service health..."
            sleep 2
            sudo systemctl status gold-4h-breakout.service --no-pager --lines=20 || true

            echo ""
            echo "==> Recent Logs (GOLD_MARKET.log):"
            tail -n 20 "$PROJECT_DIR/Logs/GOLD_MARKET.log" || echo "Log file not found."

            echo ""
            echo "==> Deployment complete."
